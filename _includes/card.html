<a class="card{% unless include.p.thumb %} card-text{% endunless %}" href="{{ include.p.url }}">
  {%- if include.p.thumb %}
  <img src="{{ include.p.thumb }}" alt="" loading="lazy" width="800" height="400">
  {%- endif %}
  <span class="card-title">{{ include.p.title }}</span>
  {%- if include.p.summary %}<span class="card-summary">{{ include.p.summary }}</span>{% endif %}
</a>
