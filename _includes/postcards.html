<div class="pano" data-pano>
  <div class="pano-frame" tabindex="0" role="region" aria-roledescription="panorama"
       aria-label="Digital Postcards panorama. Drag, swipe or use the arrow keys to travel.">
    {%- for i in (1..9) %}
    <div class="pano-layer" data-depth="0.{{ i }}">
      <img src="/assets/postcards/layer{{ i }}.svg" alt="" draggable="false" loading="lazy">
      <img src="/assets/postcards/layer{{ i }}.svg" alt="" draggable="false" loading="lazy">
    </div>
    {%- endfor %}
    <button class="pano-arrow pano-prev" type="button" aria-label="Previous destination"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="pano-arrow pano-next" type="button" aria-label="Next destination"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    <span class="pano-hint" aria-hidden="true">Drag to travel</span>
  </div>
  <ol class="pano-stops" aria-label="Destinations">
    <li><button type="button" data-at="0.26">Beach</button></li>
    <li><button type="button" data-at="0.39">Green valley</button></li>
    <li><button type="button" data-at="0.53">Desert</button></li>
    <li><button type="button" data-at="0.665">Fjord</button></li>
    <li><button type="button" data-at="0.8">Mountains</button></li>
    <li><button type="button" data-at="0.925">Night sky</button></li>
  </ol>
</div>
<script src="/assets/js/postcards.js" defer></script>
